[scoring]
title_weight = 4
body_weight = 1
# Points added when the job clearly accepts applicants from the Philippines / worldwide
# (for "abroad" job types: when the post offers visa sponsorship).
eligible_bonus = 6
# Titles with these words are pushed down (for early-career people; can be switched off in Settings).
demote_title = ["senior", "sr.", "staff", "principal", "team lead", "tech lead", "lead engineer", "lead developer", "head of", "director", "vp ", "manager", "architect"]
demote_points = 5
# Titles with these words are hidden completely (not applied to "abroad" job types).
exclude_title = ["on-site", "onsite", "on site", "hybrid", "nurse", "driver", "teacher", "tutor", "sales closer", "cold caller", "appointment setter"]
# Jobs scoring below this are hidden by default in the dashboard (toggle "show all" to see them).
min_score = 8
# Jobs posted (or first seen) more than this many days ago drop out of the inbox (likely filled).
max_age_days = 14
# Jobs posted in the last fresh_days get fresh_bonus points while they are new: early applicants get read.
fresh_days = 2
fresh_bonus = 3

# ---------------------------------------------------------------------------
# Pay. Stated pay is converted to an estimated USD per month so jobs can be compared
# ("$5/hr" counts as full-time hours). Jobs that don't state pay are left alone.
# The dashboard also has a "Min pay" filter; this section only affects ranking.
# ---------------------------------------------------------------------------
[pay]
good_usd_month = 1200   # at or above this: +good_bonus points
good_bonus = 4
low_usd_month = 500     # below this: -low_penalty points
low_penalty = 4
hours_per_month = 160   # used to convert hourly rates

[pay.rates]             # rough conversion to USD; see engine/pay.py for the full list
php = 0.0172            # 1 PHP in USD (about 58 PHP per USD)

# ---------------------------------------------------------------------------
# Application tracker.
# ---------------------------------------------------------------------------
[tracking]
follow_up_days = 5      # an application with no reply is flagged for a follow-up after this many days
ghost_days = 21         # after this many days with no reply it can be closed as "No response"

# ---------------------------------------------------------------------------
# Location eligibility for "remote" job types. Many "remote" jobs are US/EU-only; these rules sort them out.
# ---------------------------------------------------------------------------
[location]
# A job's location field containing any of these = you can apply.
ok = ["worldwide", "anywhere", "global", "philippines", "apac", "asia", "southeast asia", "remote - all", "international"]
# Phrases in the description that mean you can't apply.
blocked_phrases = [
  "us only", "usa only", "u.s. only", "us-only", "us residents only", "must reside in the us",
  "must be located in the us", "must be based in the us", "authorized to work in the us",
  "authorized to work in the united states", "us citizen", "u.s. citizen", "green card",
  "eu only", "emea only", "must be based in europe", "must reside in canada", "uk only",
  "must be located in the united states", "w-2", "w2 only",
]

# ---------------------------------------------------------------------------
# Visa sponsorship, for "abroad" job types. A post mentioning one of `sponsor` gets a
# "visa sponsorship" tag and the eligible bonus; one mentioning `no_sponsor` is hidden.
# ---------------------------------------------------------------------------
[abroad]
sponsor = [
  "visa sponsorship", "visa sponsored", "sponsor your visa", "sponsorship available", "visa provided",
  "visa support", "visa assistance", "visa and work permit", "work visa", "work permit", "visa processing",
  "visa costs", "visa fees", "j-1", "j1 visa", "h-1b", "h1b", "relocation package", "relocation allowance",
  "relocation support", "flights", "airfare", "annual flight", "housing allowance", "accommodation provided",
  "free accommodation", "international candidates", "overseas candidates", "overseas applicants",
  "international applicants", "international hires", "overseas hire",
]
no_sponsor = [
  "no visa sponsorship", "not able to sponsor", "unable to sponsor", "cannot sponsor", "can not sponsor",
  "will not sponsor", "do not sponsor", "does not sponsor", "not offer sponsorship", "no sponsorship",
  "sponsorship is not available", "must have the right to work", "must already have the right to work",
  "must already hold", "local hire only", "local hires only", "locals only", "local candidates only",
  "only open to citizens", "must be a citizen",
]

# ---------------------------------------------------------------------------
# Sites. Each person can switch these on/off in Settings and pick them per fetch.
# ---------------------------------------------------------------------------
# OnlineJobs.ph and Himalayas search every chosen "remote" job type's `search` terms.
# Paging stops early once a page has nothing new, so daily runs stay short;
# max_pages only matters on the first run or after a long break.
[sources.onlinejobs]
enabled = true
max_pages = 3          # 30 jobs per page
delay_seconds = 3      # pause between requests
extra_search = []      # OLJ-only terms, if any

[sources.himalayas]
enabled = true
# Searches only jobs open to applicants in this country.
country = "Philippines"
max_pages = 2          # 20 jobs per page (sorted by relevance, not date)
delay_seconds = 2      # Himalayas rate-limits at roughly 30 quick requests
extra_search = []

[sources.jobicy]
enabled = true
geos = ["apac", "philippines", ""]   # "" = all regions

[sources.remotive]
enabled = true

[sources.remoteok]
enabled = true

[sources.weworkremotely]
enabled = true

[sources.workingnomads]
enabled = true

# Teaching-abroad boards, used by "abroad" job types.
[sources.teachaway]
enabled = true
# Subject pages to read: the last part of teachaway.com/teaching-jobs-abroad/all-countries/all-positions/<subject>/any-level
subjects = ["math"]
max_pages = 3          # 20 jobs per page
delay_seconds = 2

[sources.seekteachers]
enabled = true
categories = [919]     # 919 = Secondary, 918 = Primary, 921 = IB (see seekteachers.com/jobs.asp)
max_pages = 4          # 20 jobs per page, newest first
delay_seconds = 2
