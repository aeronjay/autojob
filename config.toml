# autojob settings and defaults.
#
# Most people never need to open this file: the dashboard's Settings button lets each person
# turn job types on/off, edit their search terms, add their own, and pick which sites to fetch.
# Those choices are saved in data/jobs.db and override what's written here.
# Edit this file to change the built-in defaults, then run `python autojob.py rescore` (or just fetch again).

# ---------------------------------------------------------------------------
# Job types ("tracks"): what kinds of jobs to look for and how to rank them.
#   label    = name shown in the dashboard.
#   kind     = "remote" (work from the Philippines) or "abroad" (move to another country:
#              ranked by visa sponsorship instead of "open to PH", fetched from teaching-abroad sites).
#   enabled  = on by default for a new user (each person can change it in Settings).
#   search   = terms typed into the sites' search boxes (each one is a search). They count for ranking too.
#   keywords = extra ranking words.
# A job gets title_weight points per term found in its title, body_weight if only in the
# description, and is filed under whichever job type scores highest.
# ---------------------------------------------------------------------------
[tracks.automation]
label = "Automation / AI VA"
enabled = true
search = [
  "zapier", "n8n", "make.com", "workflow automation", "automation specialist", "gohighlevel",
  "ai automation", "chatgpt", "ai assistant", "airtable", "web scraping", "python",
]
keywords = [
  "integromat", "automation", "automate", "workflow", "ai specialist", "claude", "gemini",
  "llm", "prompt", "highlevel", "ghl", "api integration", "scraper", "scraping", "apps script",
  "no-code", "low-code", "crm automation",
]

[tracks.specialized_va]
label = "Tech / Lead Gen VA"
enabled = true
search = ["lead generation", "web research", "hubspot", "wordpress", "tech virtual assistant"]
keywords = [
  "virtual assistant", "lead gen", "lead research", "data research", "web research", "data scraping",
  "prospect", "list building", "data entry", "crm", "website", "web assistant", "technical va",
  "tech va", "tech support", "spreadsheet", "google sheets",
]

[tracks.executive_assistant]
label = "Executive Assistant"
enabled = true
search = [
  "executive assistant", "personal assistant", "administrative assistant", "admin assistant",
  "calendar management", "inbox management",
]
keywords = [
  "calendar", "inbox", "email management", "scheduling", "schedule meetings", "travel arrangements",
  "travel booking", "ceo", "founder", "executive", "admin support", "administrative support",
  "google workspace", "notion", "asana", "clickup", "slack", "meeting notes", "minutes",
  "expense reports", "correspondence", "document management", "chief of staff", "gatekeeping",
]

[tracks.ecommerce]
